<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit User · Premium Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand">
            <i class="fas fa-cube"></i>
            <span>Premium Admin</span>
        </div>
        <nav class="sidebar-nav">
            <a href="/" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
            <a href="/add" class="nav-item"><i class="fas fa-user-plus"></i><span>Add User</span></a>
            <a href="#" class="nav-item"><i class="fas fa-cog"></i><span>Settings</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-info">
                <div class="avatar">A</div>
                <div><div class="user-name">Admin</div><div class="user-role">Administrator</div></div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <div class="topbar-left">
                <h1>Edit User</h1>
                <p class="breadcrumb">Home / Users / Edit #{{ user['id'] }}</p>
            </div>
        </header>

        <div class="form-container">
            <div class="form-card">
                <div class="form-header">
                    <div class="form-icon form-icon-edit"><i class="fas fa-pen"></i></div>
                    <div>
                        <h2>Edit User #{{ user['id'] }}</h2>
                        <p>Update user information</p>
                    </div>
                </div>

                {% if error %}
                <div class="alert alert-error">
                    <i class="fas fa-exclamation-circle"></i> {{ error }}
                </div>
                {% endif %}

                <form method="post">
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Full Name</label>
                        <input type="text" name="name" value="{{ user['name'] }}" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-envelope"></i> Email Address</label>
                        <input type="email" name="email" value="{{ user['email'] }}" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-premium">
                            <i class="fas fa-save"></i> Update User
                        </button>
                        <a href="/" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
