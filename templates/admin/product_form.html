<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Edit' if product else 'Add' }} iPhone</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><i class="fab fa-apple"></i><span>iPhone Admin</span></div>
        <nav class="sidebar-nav">
            <a href="/admin" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
            <a href="/admin/products" class="nav-item active"><i class="fas fa-mobile-alt"></i><span>Products</span></a>
            <a href="/admin/orders" class="nav-item"><i class="fas fa-shopping-cart"></i><span>Orders</span></a>
            <a href="/" class="nav-item"><i class="fas fa-globe"></i><span>View Store</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="form-container">
            <div class="form-card">
                <div class="form-header">
                    <div class="form-icon"><i class="fas fa-mobile-alt"></i></div>
                    <div>
                        <h2>{{ 'Edit' if product else 'Add New' }} iPhone</h2>
                        <p>Fill in the product details</p>
                    </div>
                </div>

                <form method="post">
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> Model</label>
                        <input type="text" name="model" value="{{ product['model'] if product else '' }}" required placeholder="iPhone 18 Pro Max">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-hdd"></i> Storage</label>
                        <input type="text" name="storage" value="{{ product['storage'] if product else '' }}" required placeholder="256GB">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-palette"></i> Color</label>
                        <input type="text" name="color" value="{{ product['color'] if product else '' }}" placeholder="Black">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-dollar-sign"></i> Price (USD)</label>
                        <input type="number" step="0.01" name="price" value="{{ product['price'] if product else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-box"></i> Stock</label>
                        <input type="number" name="stock" value="{{ product['stock'] if product else 0 }}" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar"></i> Year</label>
                        <input type="number" name="year" value="{{ product['year'] if product else 2026 }}" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-align-left"></i> Description</label>
                        <textarea name="description" rows="3">{{ product['description'] if product else '' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label><input type="checkbox" name="featured" {% if product and product['featured'] %}checked{% endif %}> Featured</label>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-premium"><i class="fas fa-save"></i> Save</button>
                        <a href="/admin/products" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
