<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>{{ 'Edit' if service else 'Add' }} Service</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-brand"><i class="fas fa-cube"></i><span>Admin Panel</span></div>
        <nav class="sidebar-nav">
            <a href="/admin" class="nav-item"><i class="fas fa-chart-line"></i><span>Dashboard</span></a>
            <a href="/admin/services" class="nav-item active"><i class="fas fa-concierge-bell"></i><span>Services</span></a>
            <a href="/admin/bookings" class="nav-item"><i class="fas fa-calendar-check"></i><span>Bookings</span></a>
            <a href="/" class="nav-item"><i class="fas fa-globe"></i><span>View Website</span></a>
        </nav>
    </aside>

    <main class="main-content">
        <div class="form-container">
            <div class="form-card">
                <div class="form-header">
                    <div class="form-icon"><i class="fas fa-concierge-bell"></i></div>
                    <div>
                        <h2>{{ 'Edit' if service else 'Add New' }} Service</h2>
                        <p>Fill in the service details</p>
                    </div>
                </div>

                <form method="post">
                    <div class="form-group">
                        <label><i class="fas fa-tag"></i> Service Name</label>
                        <input type="text" name="name" value="{{ service['name'] if service else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-align-left"></i> Description</label>
                        <textarea name="description" rows="3" style="width:100%;padding:13px;background:var(--bg-main);border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;resize:vertical;">{{ service['description'] if service else '' }}</textarea>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-dollar-sign"></i> Price (USD)</label>
                        <input type="number" step="0.01" name="price" value="{{ service['price'] if service else '' }}" required>
                    </div>
                    <div class="form-group">
                        <label><i class="far fa-clock"></i> Duration</label>
                        <input type="text" name="duration" value="{{ service['duration'] if service else '' }}" placeholder="e.g. 2 weeks">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-icons"></i> Icon (Font Awesome class)</label>
                        <input type="text" name="icon" value="{{ service['icon'] if service else 'fa-concierge-bell' }}" placeholder="fa-code, fa-mobile-alt, ...">
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-premium"><i class="fas fa-save"></i> Save</button>
                        <a href="/admin/services" class="btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
