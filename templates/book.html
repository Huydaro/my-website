<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>កក់ {{ service['name'] }} · Premium Services</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand"><i class="fas fa-cube"></i><span>Premium Services</span></a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/admin">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container form-container">
        <div class="form-card">
            <div class="form-header">
                <div class="form-icon"><i class="fas fa-calendar-check"></i></div>
                <div>
                    <h2>កក់សេវាកម្ម</h2>
                    <p>{{ service['name'] }} — ${{ "%.2f"|format(service['price']) }}</p>
                </div>
            </div>

            <form method="post">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> ឈ្មោះរបស់អ្នក</label>
                    <input type="text" name="name" required placeholder="សុខ ដារា">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> អ៊ីមែល</label>
                    <input type="email" name="email" required placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-phone"></i> លេខទូរស័ព្ទ</label>
                    <input type="tel" name="phone" placeholder="012 345 678">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-calendar"></i> កាលបរិច្ឆេទចង់ចាប់ផ្តើម</label>
                    <input type="date" name="booking_date">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-comment"></i> ចំណាំបន្ថែម</label>
                    <textarea name="notes" rows="3" placeholder="ប្រាប់យើងពីតម្រូវការរបស់អ្នក..." style="width:100%;padding:13px;background:var(--bg-main);border:1px solid var(--border);border-radius:10px;font-family:inherit;font-size:15px;resize:vertical;"></textarea>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-premium">
                        <i class="fas fa-check"></i> បញ្ជាក់ការកក់
                    </button>
                    <a href="/" class="btn-secondary">បោះបង់</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
