<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <title>{{ service['name'] }} · Premium Services</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand"><i class="fas fa-cube"></i><span>Premium Services</span></a>
            <div class="nav-links">
                <a href="/">Home</a>
                <a href="/admin">Admin</a>
            </div>
        </div>
    </nav>

    <div class="container detail-container">
        <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> ត្រលប់ក្រោយ</a>

        <div class="detail-card">
            <div class="detail-icon">
                <i class="fas {{ service['icon'] }}"></i>
            </div>
            <h1>{{ service['name'] }}</h1>
            <p class="detail-desc">{{ service['description'] }}</p>

            <div class="detail-meta">
                <div class="meta-item">
                    <i class="fas fa-tag"></i>
                    <span>តម្លៃ: <strong>${{ "%.2f"|format(service['price']) }}</strong></span>
                </div>
                <div class="meta-item">
                    <i class="far fa-clock"></i>
                    <span>រយៈពេល: <strong>{{ service['duration'] }}</strong></span>
                </div>
            </div>

            <a href="/book/{{ service['id'] }}" class="btn-premium btn-large">
                <i class="fas fa-calendar-check"></i> កក់សេវាកម្មនេះ
            </a>
        </div>
    </div>
</body>
</html>
